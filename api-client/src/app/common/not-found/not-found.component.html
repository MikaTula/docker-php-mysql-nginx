<div class="not-found">
  <mat-card class="not-found__card" appearance="outlined">
    <mat-card-header class="not-found__header">
      <div mat-card-avatar class="not-found__avatar" aria-hidden="true">
        <mat-icon class="not-found__avatar-icon">travel_explore</mat-icon>
      </div>
      <mat-card-title>Page not found</mat-card-title>
      <mat-card-subtitle>Error 404</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="not-found__body">
      <p class="not-found__lead">
        Этой страницы нет.
        Вы можете уточнить адрес в меню или вернуться
      </p>
    </mat-card-content>

    <mat-card-actions class="not-found__actions" align="end">
      <a matButton routerLink="/songs">Back to app</a>
    </mat-card-actions>
  </mat-card>
</div>

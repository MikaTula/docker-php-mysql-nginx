<mat-card class="card" appearance="outlined">
  <mat-card-header class="card__header">
    <mat-card-title>Register</mat-card-title>
  </mat-card-header>
  <mat-card-content class="card__content" [formGroup]="registerForm">

    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput type="text" formControlName="email">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Confirm password</mat-label>
      <input matInput type="password" formControlName="c_password">
    </mat-form-field>

    @if (registerForm.hasError('passwordMismatch')) {
      <div class="hint hint_error">Passwords do not match</div>
    }

  </mat-card-content>
  <mat-card-footer class="card__footer">
    <button matButton [disabled]="!(canSubmit | async)" (click)="tryRegister()">Register</button>
    <button matButton type="button" routerLink="/auth/sign-in">To login</button>
  </mat-card-footer>
</mat-card>

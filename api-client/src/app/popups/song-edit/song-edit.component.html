<mat-card class="card" appearance="outlined">
  @if (!loading()) {
    <mat-card-header class="card__header">
      <mat-card-title>Song edit</mat-card-title>
    </mat-card-header>
    <mat-card-content class="card__content" [formGroup]="songEditForm">

      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name">
      </mat-form-field>

<!--      <mat-form-field>-->
<!--        <mat-label>Singer direct value</mat-label>-->
<!--        <input matInput type="number" formControlName="singer_id">-->
<!--      </mat-form-field>-->

      <app-singer-select formControlName="singer_id"></app-singer-select>

      <mat-form-field>
        <mat-label>Year</mat-label>
        <input matInput type="number" formControlName="year">
      </mat-form-field>

    </mat-card-content>
    <mat-card-footer class="card__footer">
      <button matButton [disabled]="!(canSave | async)" (click)="save()">Save</button>
    </mat-card-footer>

  } @else {
    <app-spinner></app-spinner>
  }
</mat-card>

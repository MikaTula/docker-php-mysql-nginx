server {
    listen 80;
    #listen 443 ssl http2;
	
    server_name hello-docker.loc;

    index index.html index.htm index.php;

    charset utf-8;
    sendfile off;
    client_max_body_size 128m;

	error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    root /var/www/api-server;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream cm-api-server:9000;

    add_header Access-Control-Expose-Headers Accept-Ranges;
    add_header Access-Control-Expose-Headers Content-Encoding;
    add_header Access-Control-Expose-Headers Content-Length;
    add_header Access-Control-Expose-Headers Content-Range;
    add_header accept_ranges bytes;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
	
    location = /examples {
        return 301 /examples/;
    }

    location ^~ /examples/ {
        root /var/www;
        try_files $uri $uri/ /examples/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass $php_upstream;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        alias /var/www/api-docs/;
        index index.html;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        alias /var/www/api-client/;
        index index.html;
    }

    location ^~ /api/users {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/api-server/users-api-example.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

	location / {
      try_files $uri $uri/ /index.php?$query_string;
    }
	
    location ~ \.php$ {
		set $new_url $request_uri;
	
        # fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PHP_VALUE "upload_max_filesize=128M \n post_max_size=128M";
		fastcgi_param REQUEST_URI $new_url;
    }


    location ~ /\.ht {
        deny all;
    }

}
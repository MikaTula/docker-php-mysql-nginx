openapi: 3.1.0
info:
  title: Laravel API Documentation
  description: API documentation for Laravel application with authentication and songs management
  version: 1.0.0

servers:
  - url: http://api.music.local/api
    description: Local development server

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: User
    description: User management endpoints
  - name: Songs
    description: Songs management endpoints

paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account and receive an authentication token
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - c_password
              properties:
                name:
                  type: string
                  description: User's full name
                  example: John Doe
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  description: User's password
                  example: password123
                c_password:
                  type: string
                  format: password
                  description: Password confirmation (must match password)
                  example: password123
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  token: "1|abcdefghijklmnopqrstuvwxyz1234567890"
                  name: "John Doe"
                message: "User register successfully."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Validation Error."
                data:
                  email: ["The email field is required."]
                  password: ["The password field is required."]

  /login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive an authentication token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "test@mail.test"
                password:
                  type: string
                  format: password
                  description: User's password
                  example: "Password1"
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  token: "1|abcdefghijklmnopqrstuvwxyz1234567890"
                  name: "John Doe"
                message: "User login successfully."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Unauthorised."
                data:
                  error: "Unauthorised"

  /user:
    get:
      tags:
        - User
      summary: Get current user
      description: Get the authenticated user's information
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: "John Doe"
                  email:
                    type: string
                    format: email
                    example: "john.doe@example.com"
                  email_verified_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /songs:
    get:
      tags:
        - Songs
      summary: List all songs
      description: Retrieve a list of all songs
      operationId: listSongs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Songs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  - id: 1
                    name: "Bohemian Rhapsody"
                    user_id: 1
                    year: 1975
                    created_at: "29/01/2026"
                    updated_at: "29/01/2026"
                  - id: 2
                    name: "Stairway to Heaven"
                    user_id: 1
                    year: 1971
                    created_at: "29/01/2026"
                    updated_at: "29/01/2026"
                message: "Songs retrieved successfully."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Songs
      summary: Create a new song
      description: Create a new song record
      operationId: createSong
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - user_id
                - year
              properties:
                name:
                  type: string
                  description: Song name
                  example: "Bohemian Rhapsody"
                user_id:
                  type: integer
                  description: ID of the user who owns the song
                  example: 1
                year:
                  type: integer
                  description: Year the song was released
                  example: 1975
      responses:
        '200':
          description: Song created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 1
                  name: "Bohemian Rhapsody"
                  user_id: 1
                  year: 1975
                  created_at: "29/01/2026"
                  updated_at: "29/01/2026"
                message: "Song created successfully."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /songs/{id}:
    get:
      tags:
        - Songs
      summary: Get a specific song
      description: Retrieve a specific song by its ID
      operationId: getSong
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Song ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Song retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 1
                  name: "Bohemian Rhapsody"
                  user_id: 1
                  year: 1975
                  created_at: "29/01/2026"
                  updated_at: "29/01/2026"
                message: "Song retrieved successfully."
        '404':
          description: Song not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Song not found."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Songs
      summary: Update a song
      description: Update an existing song
      operationId: updateSong
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Song ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - user_id
                - year
              properties:
                name:
                  type: string
                  description: Song name
                  example: "Bohemian Rhapsody"
                user_id:
                  type: integer
                  description: ID of the user who owns the song
                  example: 1
                year:
                  type: integer
                  description: Year the song was released
                  example: 1975
      responses:
        '200':
          description: Song updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 1
                  name: "Bohemian Rhapsody (Updated)"
                  user_id: 1
                  year: 1975
                  created_at: "29/01/2026"
                  updated_at: "29/01/2026"
                message: "Song updated successfully."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Songs
      summary: Update a song (partial)
      description: Partially update an existing song
      operationId: patchSong
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Song ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Song name
                  example: "Bohemian Rhapsody"
                user_id:
                  type: integer
                  description: ID of the user who owns the song
                  example: 1
                year:
                  type: integer
                  description: Year the song was released
                  example: 1975
      responses:
        '200':
          description: Song updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Songs
      summary: Delete a song
      description: Delete a song by its ID
      operationId: deleteSong
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Song ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Song deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data: []
                message: "Song deleted successfully."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use the token received from the `/register` or `/login` endpoint.
        Include it in the Authorization header as: `Bearer {token}`

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          oneOf:
            - type: object
            - type: array
          description: Response data
        message:
          type: string
          description: Success message
          example: "Operation completed successfully."

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Error message
          example: "An error occurred."
        data:
          oneOf:
            - type: object
            - type: array
          description: Error details
          nullable: true

    Song:
      type: object
      properties:
        id:
          type: integer
          description: Song ID
          example: 1
        name:
          type: string
          description: Song name
          example: "Bohemian Rhapsody"
        user_id:
          type: integer
          description: ID of the user who owns the song
          example: 1
        year:
          type: integer
          description: Year the song was released
          example: 1975
        created_at:
          type: string
          description: "Creation date (format: d/m/Y)"
          example: "29/01/2026"
        updated_at:
          type: string
          description: "Last update date (format: d/m/Y)"
          example: "29/01/2026"
